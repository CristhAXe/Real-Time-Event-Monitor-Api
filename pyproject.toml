[project]
name = "real-time-event-monitor-api"
version = "0.1.0"
description = "Real-Time Event Monitor API"
readme = "README.md"
authors = [{ name = "CristhAXe", email = "znkcristh@protonmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "sqlalchemy==2.0.51",
  "alembic==1.19.0",
  "asyncpg==0.31.0",
  "redis==8.1.0",
  "websockets==17.0.1",
  "python-dotenv==1.2.2",
  "google-generativeai==0.8.6",
  "pydantic-settings==2.14.2",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "starlette==1.4.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
